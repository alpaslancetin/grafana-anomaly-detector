# Prometheus source -> exporter Prometheus metrics (/metrics).
global:
  prometheus_url: http://127.0.0.1:9090
  evaluation_interval_seconds: 10
  request_timeout_seconds: 10
  listen_host: 0.0.0.0
  listen_port: 9110
  config_reload_interval_seconds: 10
  max_dynamic_rules: 5000
  max_rules_per_panel: 50
  max_query_length: 16384
  max_feed_series: 1000
  runtime_scope_ttl_seconds: 3600
  pushed_feed_ttl_seconds: 300
  api_rate_limit_per_minute: 120

rules:
  - name: service_latency_score
    description: Edit the PromQL selector and labels before production use.
    query: http_request_duration_seconds
    source_type: prometheus
    range_seconds: 1800
    step_seconds: 15
    bucket_span_seconds: 60
    algorithm: mad
    # high_mean: only increases, low_mean: only decreases, high_or_low: both.
    anomaly_direction: high_mean
    threshold: 4.0
    baseline_window: 12
    minimum_absolute_deviation: 0
    minimum_relative_deviation: 0
    minimum_activity: 0
    persistence_buckets: 3
    persistence_window: 4
    recovery_threshold: 3.0
    recovery_buckets: 2
    cooldown_buckets: 2
    data_quality_gate: true
    severity_preset: page_first
    aggregation: max
    labels:
      environment: edit-me
      team: edit-me
