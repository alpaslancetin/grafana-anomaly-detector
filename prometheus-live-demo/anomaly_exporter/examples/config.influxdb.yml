# InfluxDB 2.x source -> InfluxDB anomaly score sink.
# Keep the source and score buckets separate to avoid score feedback loops.
# Before start, export both token variables:
#   export ANOMALY_SOURCE_INFLUX_TOKEN='...'
#   export ANOMALY_SINK_INFLUX_TOKEN='...'
global:
  prometheus_url: http://127.0.0.1:9090
  evaluation_interval_seconds: 10
  request_timeout_seconds: 10
  listen_host: 0.0.0.0
  listen_port: 9110
  config_reload_interval_seconds: 10

sinks:
  influxdb:
    enabled: true
    url: http://127.0.0.1:8086
    version: 2
    org: my-org
    bucket: anomaly-scores
    token_env: ANOMALY_SINK_INFLUX_TOKEN
    measurement: grafana_anomaly
    timeout_seconds: 10

rules:
  - name: influx_service_latency_score
    description: Edit bucket, measurement, field, organization and labels before use.
    query: 'from(bucket: "source-metrics") |> range(start: v.timeRangeStart, stop: v.timeRangeStop) |> filter(fn: (r) => r._measurement == "service_metrics" and r._field == "latency_ms")'
    source_type: influxdb
    datasource_url: http://127.0.0.1:8086
    target_sinks: influxdb
    range_seconds: 1800
    step_seconds: 30
    bucket_span_seconds: 60
    algorithm: mad
    threshold: 4.0
    baseline_window: 12
    severity_preset: page_first
    aggregation: max
    labels:
      environment: edit-me
      team: edit-me
