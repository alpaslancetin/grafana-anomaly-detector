# Ready-to-run Prometheus source configuration.
# Edit prometheus_url and the example query for your environment.
global:
  prometheus_url: http://127.0.0.1:9090
  evaluation_interval_seconds: 10
  request_timeout_seconds: 10
  listen_host: 0.0.0.0
  listen_port: 9110
  config_reload_interval_seconds: 10

rules:
  - name: example_prometheus_up
    description: Replace this example with the metric shown in your Grafana panel.
    query: up
    source_type: prometheus
    range_seconds: 1800
    step_seconds: 15
    bucket_span_seconds: 60
    algorithm: mad
    threshold: 4.0
    baseline_window: 12
    severity_preset: page_first
    aggregation: max
    labels:
      environment: edit-me
      owner: edit-me
